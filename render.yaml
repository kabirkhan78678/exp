services:
  # 1. Django Python Backend Service
  - type: web
    name: veltrix-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_platform
    startCommand: daphne -b 0.0.0.0 -p $PORT veltrix.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true

  # 2. Next.js Frontend Service
  - type: web
    name: veltrix-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: NEXT_PUBLIC_API_URL
        value: https://veltrix-backend.onrender.com/api

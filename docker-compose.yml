version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: veltrix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: veltrix_db
      POSTGRES_USER: veltrix_user
      POSTGRES_PASSWORD: veltrix_secure_password_99
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: veltrix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veltrix_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_platform &&
             daphne -b 0.0.0.0 -p 8000 veltrix.asgi:application"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: "prod-secret-key-veltrix-midnight-aurora-2026"
      DATABASE_URL: "postgresql://veltrix_user:veltrix_secure_password_99@db:5432/veltrix_db"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veltrix_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:80/api"
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: veltrix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
